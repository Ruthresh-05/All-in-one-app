<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniApp Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: white;
            background-color: #1a1a1a;
        }

        /* Background */
        .bg {
            position: fixed;
            width: 110%;
            height: 110%;
            top: -5%;
            left: -5%;
            background: url('https://images.unsplash.com/photo-1490806843957-31f4c9a91c65') no-repeat center center/cover;
            animation: zoomEffect 20s infinite alternate ease-in-out;
            z-index: -1;
            filter: brightness(0.5);
        }

        @keyframes zoomEffect {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        /* Dashboard Layout */
        .dashboard {
            display: flex;
            height: 100vh;
            gap: 0;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: rgba(20, 20, 30, 0.85);
            backdrop-filter: blur(15px);
            padding: 25px 20px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            overflow-y: auto;
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.3);
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        .welcome-message {
            text-align: center;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-section {
            margin-bottom: 30px;
        }

        .nav-section-title {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .sidebar ul {
            list-style: none;
        }

        .sidebar li {
            padding: 12px 15px;
            margin: 6px 0;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
            font-size: 0.95rem;
        }

        .sidebar li:hover {
            background: rgba(255, 255, 255, 0.15);
            border-left-color: #4a9eff;
        }

        .sidebar li.active {
            background: rgba(74, 158, 255, 0.2);
            border-left-color: #4a9eff;
            font-weight: 600;
        }

        .sidebar li.logout {
            color: #ff6b6b;
            margin-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
        }

        .sidebar li.logout:hover {
            background: rgba(255, 107, 107, 0.2);
            border-left-color: #ff6b6b;
        }

        /* Main Content */
        .main {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95rem;
        }

        .search-box {
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
        }

        .search-box input {
            padding: 12px 16px;
            width: 300px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: #4a9eff;
            box-shadow: 0 0 12px rgba(74, 158, 255, 0.3);
        }

        .search-box input::placeholder {
            color: rgba(0, 0, 0, 0.4);
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            flex: 1;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 24px 16px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 220px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-8px);
            box-shadow: 0 8px 30px rgba(74, 158, 255, 0.2);
        }

        .card-icon {
            width: 60px;
            height: 60px;
            margin-bottom: 10px;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .card:hover .card-icon {
            transform: scale(1.15);
        }

        .card h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            word-break: break-word;
        }

        .card-category {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 12px;
        }

        .card button {
            margin-top: auto;
            padding: 10px 18px;
            border: none;
            background: linear-gradient(135deg, #4a9eff 0%, #357abd 100%);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .card button:hover {
            background: linear-gradient(135deg, #357abd 0%, #2a5a94 100%);
            transform: scale(1.05);
        }

        .card button:active {
            transform: scale(0.98);
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: rgba(255, 255, 255, 0.8);
        }

        .empty-state p {
            color: rgba(255, 255, 255, 0.6);
            max-width: 400px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .dashboard {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                padding: 15px;
                max-height: 120px;
                overflow-x: auto;
                display: flex;
                gap: 20px;
                align-items: center;
            }

            .sidebar h2 {
                margin-bottom: 0;
                flex-shrink: 0;
            }

            .welcome-message {
                display: none;
            }

            .nav-section {
                display: flex;
                gap: 10px;
                margin-bottom: 0;
            }

            .nav-section-title {
                display: none;
            }

            .sidebar ul {
                display: flex;
                gap: 8px;
            }

            .sidebar li {
                margin: 0;
                white-space: nowrap;
                flex-shrink: 0;
            }

            .main {
                padding: 20px;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .search-box {
                flex-direction: column;
            }

            .search-box input {
                width: 100%;
            }

            .grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 15px;
            }

            .card {
                min-height: 180px;
                padding: 16px 12px;
            }
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body>
    <div class="bg"></div>

    <div class="dashboard">
        <aside class="sidebar" role="navigation" aria-label="Main navigation">
            <h2>🌸 UniApp</h2>
            <div class="welcome-message" id="welcomeUser"></div>

            <div class="nav-section">
                <div class="nav-section-title">Categories</div>
                <ul id="filterList">
                    <li onclick="filterApps('All')" data-category="All">All Apps</li>
                    <li onclick="filterApps('Social')" data-category="Social">Social</li>
                    <li onclick="filterApps('Shopping')" data-category="Shopping">Shopping</li>
                    <li onclick="filterApps('Work')" data-category="Work">Work</li>
                    <li onclick="filterApps('Entertainment')" data-category="Entertainment">Entertainment</li>
                </ul>
            </div>

            <ul style="margin-top: auto;">
                <li class="logout" onclick="logout()" title="Click to logout">🚪 Logout</li>
            </ul>
        </aside>

        <main class="main" role="main">
            <div class="header">
                <h1>Your Apps</h1>
                <p>Explore and open your favorite applications</p>
            </div>

            <div class="search-box">
                <input 
                    type="text" 
                    id="search" 
                    placeholder="Search apps by name..." 
                    onkeyup="searchApp()"
                    aria-label="Search applications"
                >
            </div>

            <div class="grid" id="apps" role="region" aria-label="Applications grid"></div>
        </main>
    </div>

    <script>
        // ================= CONFIG =================
        const CONFIG = {
            loginPage: 'login.html',
            storageKeys: {
                loggedIn: 'loggedIn',
                currentUser: 'currentUser'
            }
        };

        // ================= APPS DATA =================
        const APPS = [
            { 
                name: "YouTube", 
                category: "Entertainment", 
                url: "https://www.youtube.com", 
                icon: "https://cdn-icons-png.flaticon.com/512/1384/1384060.png" 
            },
            { 
                name: "Amazon", 
                category: "Shopping", 
                url: "https://www.amazon.in", 
                icon: "https://cdn-icons-png.flaticon.com/512/732/732229.png" 
            },
            { 
                name: "Instagram", 
                category: "Social", 
                url: "https://www.instagram.com", 
                icon: "https://cdn-icons-png.flaticon.com/512/2111/2111463.png" 
            },
            { 
                name: "Google", 
                category: "Work", 
                url: "https://www.google.com", 
                icon: "https://cdn-icons-png.flaticon.com/512/300/300221.png" 
            },
            { 
                name: "Netflix", 
                category: "Entertainment", 
                url: "https://www.netflix.com", 
                icon: "https://cdn-icons-png.flaticon.com/512/5977/5977590.png" 
            }
        ];

        // ================= INITIALIZATION =================
        function init() {
            checkAuth();
            setupWelcomeMessage();
            displayApps();
            setupEventListeners();
        }

        // ================= AUTHENTICATION =================
        function checkAuth() {
            if (localStorage.getItem(CONFIG.storageKeys.loggedIn) !== "true") {
                window.location.href = CONFIG.loginPage;
            }
        }

        // ================= UI SETUP =================
        function setupWelcomeMessage() {
            const username = localStorage.getItem(CONFIG.storageKeys.currentUser) || "Guest";
            const element = document.getElementById("welcomeUser");
            element.textContent = `Welcome, ${sanitizeHTML(username)}`;
        }

        function setupEventListeners() {
            updateActiveFilter('All');
        }

        // ================= DISPLAY APPS =================
        function displayApps(list = APPS) {
            const container = document.getElementById("apps");
            container.innerHTML = "";

            if (list.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1 / -1;">
                        <div class="empty-state">
                            <div class="empty-state-icon">📭</div>
                            <h3>No apps found</h3>
                            <p>Try adjusting your search or filter to find what you're looking for.</p>
                        </div>
                    </div>
                `;
                return;
            }

            list.forEach(app => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img class="card-icon" src="${sanitizeHTML(app.icon)}" alt="${sanitizeHTML(app.name)} icon" loading="lazy">
                    <h3>${sanitizeHTML(app.name)}</h3>
                    <span class="card-category">${sanitizeHTML(app.category)}</span>
                    <button onclick="openApp('${sanitizeHTML(app.url)}')" aria-label="Open ${sanitizeHTML(app.name)}">Open</button>
                `;
                container.appendChild(card);
            });
        }

        // ================= FILTERING =================
        function filterApps(category) {
            const filtered = category === "All" 
                ? APPS 
                : APPS.filter(app => app.category === category);
            
            displayApps(filtered);
            updateActiveFilter(category);
            clearSearch();
        }

        function updateActiveFilter(category) {
            document.querySelectorAll('#filterList li').forEach(li => {
                li.classList.toggle('active', li.dataset.category === category);
            });
        }

        // ================= SEARCH =================
        function searchApp() {
            const searchValue = document.getElementById("search").value.toLowerCase().trim();
            
            const filtered = searchValue === "" 
                ? APPS 
                : APPS.filter(app => 
                    app.name.toLowerCase().includes(searchValue)
                );
            
            displayApps(filtered);
        }

        function clearSearch() {
            document.getElementById("search").value = "";
        }

        // ================= APP INTERACTION =================
        function openApp(url) {
            if (isValidURL(url)) {
                window.open(url, '_blank', 'noopener,noreferrer');
            } else {
                console.error('Invalid URL:', url);
                alert('Unable to open this app. Invalid URL.');
            }
        }

        // ================= LOGOUT =================
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem(CONFIG.storageKeys.loggedIn);
                localStorage.removeItem(CONFIG.storageKeys.currentUser);
                window.location.href = CONFIG.loginPage;
            }
        }

        // ================= UTILITIES =================
        function sanitizeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function isValidURL(string) {
            try {
                new URL(string);
                return true;
            } catch (_) {
                return false;
            }
        }

        // ================= START =================
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
